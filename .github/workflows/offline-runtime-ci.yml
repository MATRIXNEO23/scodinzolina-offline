name: GPTina Offline Runtime CI

on:
  workflow_dispatch:
  push:
    paths:
      - "offline-runtime/**"
      - ".github/workflows/offline-runtime-ci.yml"
  pull_request:
    paths:
      - "offline-runtime/**"
      - ".github/workflows/offline-runtime-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile runtime
        run: python -m py_compile offline-runtime/gptina_memory_server.py offline-runtime/gptina_chat_bridge.py offline-runtime/gptina_offline_app.pyw offline-runtime/install_llama_engine.py
      - name: Unit tests
        run: python -m unittest discover -s offline-runtime -p "test_*.py" -v
